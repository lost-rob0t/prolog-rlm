# PrologAgent semantic-owner fence for DeepSeek Harness.
#
# Apply after dsh-base and the selected surface bundle.  These rows are
# intentionally disabled before the Prolog-backed Cordis Agent factory is
# mounted: a missing/failed Prolog provider must fail agent creation instead of
# silently falling back to the stock DeepSeek Harness loop or history rewriting.
#
# This is an overlay, not a complete runnable profile yet.  The next slice adds
# the local Prolog Agent factory row and projects prolog_agent_ui_v1 events into
# the Harness session/UI vocabulary.

- id: agent-loop
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true
