# PrologAgent semantic-owner fence for DeepSeek Harness.
#
# Apply after dsh-base and the selected surface bundle. The stock agent loop
# and any history rewriting remain disabled. The replacement factory is an
# out-of-tree package whose driver crosses the NDJSON boundary into Prolog-RLM.
# If that package or bridge is missing, profile boot/agent creation fails closed.

- id: agent-loop
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# The stock first-prompt title generator performs an auxiliary DSH-owned LLM
# call after a user message. Keep it off until title generation is routed
# through a Prolog-owned semantic command.
- id: session-title-llm
  disabled: true

- id: prolog-agent-factory
  name: '@prolog-rlm/dsh-agent-factory'
  config: {}
