# Headless-only DeepSeek Harness profile for PrologAgent.
#
# DeepSeek Harness remains the host/profile/session/agent substrate. Prolog-RLM
# remains the only semantic agent runtime. The profile intentionally leaves only
# the DSH Agent registry, Session event log, and headless argv startup mounted.
# The stock DSH model/tool/permission/history/subagent surfaces are disabled so
# there is no second agent loop hiding underneath PrologAgent.

# Core services not required by the Prolog-backed headless path.
- id: timer
  disabled: true
- id: hmr
  disabled: true
- id: llm
  disabled: true
- id: typert
  disabled: true
- id: typert-loader
  disabled: true
- id: typert-gateway
  disabled: true
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true
- id: user-questions
  disabled: true
- id: agent-default-model
  disabled: true
- id: jobs
  disabled: true
- id: llm-retry
  disabled: true
- id: settings
  disabled: true
- id: credentials
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: attachment-local
  disabled: true
- id: session-query-sqlite
  disabled: true
- id: session-projection
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: subprocess
  disabled: true

# DSH effect, permission, shell, filesystem, and tool ownership is forbidden.
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: approval
  disabled: true
- id: permission
  disabled: true
- id: shell-env
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: fs-sandbox
  disabled: true
- id: tools
  disabled: true

# DSH prompt, skills, commands, goals, planning, and token policy stay out of the
# PrologAgent semantic boundary.
- id: agent-instructions
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
- id: commands
  disabled: true
- id: command-feedback
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: token-meter
  disabled: true
- id: system-prompt
  disabled: true

# No DSH compaction, pruning, checkpoints, spill policy, or alternate agent
# machinery may rewrite or independently drive the canonical Prolog transcript.
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: session-checkpoint-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: repeat-tool-reminder
  disabled: true
- id: agent-loop
  disabled: true

# Subagents and workflow execution must eventually be projected from Prolog,
# never supplied by the stock Harness runtime.
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: timeout-policy
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true

# Network/model adapters are Prolog-owned provider routes, not DSH routes.
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: tool-web
  disabled: true
- id: llm-deepseek
  disabled: true

# The official headless bundle supplies argv parsing only. Its stock runner and
# code runtime are replaced by the Prolog-backed runner below.
- id: code-runtime
  disabled: true
- id: headless-runner
  disabled: true

# Deliberately enabled DSH spine inherited from dsh-base/dsh-headless:
#   session          @deepseek-ai/dsh-session
#   agent            @deepseek-ai/dsh-agent
#   headless-startup @deepseek-ai/dsh-headless/startup

- insert:
    - id: prolog-agent-factory
      name: '@prolog-rlm/dsh-agent-factory'
      inject: [agents, sessions]
      config: {}

    - id: prolog-headless-runner
      name: '@prolog-rlm/dsh-agent-factory/headless'
      inject: [headlessStartup, agents]
      config:
        task: !!js ctx.headlessStartup.task
