# DeepSeek Harness Web GUI for PrologAgent.
#
# Keep the official DSH Web transport and browser rendering plane, but replace
# the agent execution plane with the Prolog-backed AgentFactory. Rows below are
# disabled when they would execute model/tool/policy/history semantics outside
# Prolog-RLM. Presentation and transport rows remain inherited from dsh-web-app.

# Model routing and model-side policy are Prolog-owned.
- id: llm
  disabled: true
- id: llm-retry
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: llm-deepseek
  disabled: true
- id: agent-default-model
  disabled: true
- id: system-prompt
  disabled: true
- id: agent-instructions
  disabled: true
- id: session-title-llm
  disabled: true

# DSH must not become a second durable transcript or canonical settings source.
- id: session-persistence-jsonl
  disabled: true
- id: session-query-sqlite
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: credentials
  disabled: true

# Effect, shell, filesystem and model-facing tool execution stay in Prolog.
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: approval
  disabled: true
- id: permission
  disabled: true
- id: subprocess
  disabled: true
- id: shell-env
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: fs-sandbox
  disabled: true
- id: tools
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: code-runtime
  disabled: true

# Skills, commands, plans, goals and agent presets would otherwise expose a
# second semantic control plane in the browser.
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
- id: commands
  disabled: true
- id: command-feedback
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: user-questions
  disabled: true
- id: agent-presets
  disabled: true

# Canonical history is lossless in Prolog. DSH compaction/pruning/checkpoints
# are not allowed to rewrite or summarize it.
- id: token-meter
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: session-checkpoint-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: repeat-tool-reminder
  disabled: true

# No stock DSH driver, subagent runtime or workflow runtime.
- id: agent-loop
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: timeout-policy
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-ralph
  disabled: true

# Hide browser controls that currently target the disabled DSH semantic plane.
# The conversation/sidebar/layout/renderer/workspace surfaces stay enabled.
- id: ui-attachment
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-deliverables
  disabled: true
- id: ui-input-trigger
  disabled: true
- id: ui-commands
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-reference
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-model-selection
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-agent-preset
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-user-questions
  disabled: true
- id: ui-trajectory
  disabled: true

# Required GUI spine inherited and intentionally left enabled:
#   session, agent, session-projection
#   web-startup, webserver, web-runtime, api-gateway
#   modules, connection, api-remotes, client-runtime, cordis-client-runner
#   ui-theme, locale, ui-layout, ui-renderer, ui-sidebar, ui-conversation
#   ui-brand-official, ui-workspace

- insert:
    - id: prolog-agent-factory
      name: '@prolog-rlm/dsh-agent-factory'
      inject: [agents, sessions]
      config: {}
