[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentprolog-deepseek-tui"
version = "0.1.0"
description = "Textual TUI harness for AgentProlog using the DeepSeek profile"
requires-python = ">=3.10"
dependencies = [
  "textual>=8.2,<9",
]

[project.scripts]
deepseek-harness = "deepseek_tui.app:main"
