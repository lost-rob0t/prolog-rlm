name: One-time nested usage ledger patch

on:
  push:
    branches:
      - feature/issue-20-deep-recursion-experiments

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feature/issue-20-deep-recursion-experiments
          fetch-depth: 0

      - name: Apply exact patch once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/usage-ledger.patch ]; then
            echo "usage ledger patch already consumed"
            exit 0
          fi
          git apply --check .github/usage-ledger.patch
          git apply .github/usage-ledger.patch
          git rm .github/usage-ledger.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prolog/rlm_plan.pl prolog/rlm_completion.pl
          git commit -m "fix(completion): account nested model usage"
          git push origin HEAD:feature/issue-20-deep-recursion-experiments
