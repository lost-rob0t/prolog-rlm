name: One-time nested usage ledger patch

on:
  push:
    branches:
      - feature/issue-20-deep-recursion-experiments

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feature/issue-20-deep-recursion-experiments
          fetch-depth: 0

      - name: Apply exact source replacements once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/usage-ledger.patch ]; then
            echo "usage ledger source edit already consumed"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "prolog/rlm_plan.pl",
              """initial_execution_state(Budget,\n                        exec_state{vars:_{},\n                                   transitions:[],\n                                   sequence:0,\n                                   checkpoints:[],\n                                   remaining:Remaining}) :-""",
              """initial_execution_state(Budget,\n                        exec_state{vars:_{},\n                                   model_responses:[],\n                                   transitions:[],\n                                   sequence:0,\n                                   checkpoints:[],\n                                   remaining:Remaining}) :-""",
          )

          replace_once(
              "prolog/rlm_plan.pl",
              """handle_model_result(ok(Response), Provider, Bind, State0, Outcome) :-\n    bind_value(Bind, Response, State0, BindOutcome),\n    transition_result(BindOutcome, model(Provider), Bind, Outcome).""",
              """handle_model_result(ok(Response), Provider, Bind, State0, Outcome) :-\n    record_model_response(Response, State0, State1),\n    bind_value(Bind, Response, State1, BindOutcome),\n    transition_result(BindOutcome, model(Provider), Bind, Outcome).\n\nrecord_model_response(Response, State0, State) :-\n    get_dict(model_responses, State0, Responses0),\n    put_dict(model_responses, State0, [Response|Responses0], State).""",
          )

          replace_once(
              "prolog/rlm_plan.pl",
              """    get_dict(checkpoints, State, RevCheckpoints),\n    reverse(RevCheckpoints, Checkpoints),\n    get_dict(vars, State, Vars),\n    get_dict(remaining, State, Remaining),\n    Result = plan_result{value:Value,\n                         vars:Vars,\n                         transitions:Transitions,\n                         checkpoints:Checkpoints,\n                         budget_remaining:Remaining}.\nfinalize_execution(error(Error0, State), error(Error)) :-\n    !,\n    get_dict(transitions, State, RevTransitions),\n    reverse(RevTransitions, Transitions),\n    get_dict(remaining, State, Remaining),\n    put_dict(_{transitions:Transitions,\n               budget_remaining:Remaining},\n             Error0,\n             Error).""",
              """    get_dict(checkpoints, State, RevCheckpoints),\n    reverse(RevCheckpoints, Checkpoints),\n    get_dict(vars, State, Vars),\n    get_dict(model_responses, State, RevModelResponses),\n    reverse(RevModelResponses, ModelResponses),\n    get_dict(remaining, State, Remaining),\n    Result = plan_result{value:Value,\n                         vars:Vars,\n                         model_responses:ModelResponses,\n                         transitions:Transitions,\n                         checkpoints:Checkpoints,\n                         budget_remaining:Remaining}.\nfinalize_execution(error(Error0, State), error(Error)) :-\n    !,\n    get_dict(transitions, State, RevTransitions),\n    reverse(RevTransitions, Transitions),\n    get_dict(model_responses, State, RevModelResponses),\n    reverse(RevModelResponses, ModelResponses),\n    get_dict(remaining, State, Remaining),\n    put_dict(_{transitions:Transitions,\n               model_responses:ModelResponses,\n               budget_remaining:Remaining},\n             Error0,\n             Error).""",
          )

          replace_once(
              "prolog/rlm_completion.pl",
              """plan_usage(Result, Usage) :-\n    dict_pairs(Result.vars, _, Pairs),\n    findall(Hash-Response,\n            ( member(_-Response, Pairs),\n              is_model_response(Response),\n              term_hash(Response, Hash)\n            ),\n            RawPairs),\n    sort(RawPairs, UniquePairs),\n    findall(ResponseUsage,\n            ( member(_-Response, UniquePairs),\n              response_usage(Response, ResponseUsage)\n            ),\n            Usages),\n    usage_sum(Usages, Usage).""",
              """plan_usage(Result, Usage) :-\n    plan_model_responses(Result, Responses),\n    findall(ResponseUsage,\n            ( member(Response, Responses),\n              response_usage(Response, ResponseUsage)\n            ),\n            Usages),\n    usage_sum(Usages, Usage).\n\nplan_model_responses(Result, Responses) :-\n    get_dict(model_responses, Result, Recorded),\n    is_list(Recorded),\n    !,\n    Responses = Recorded.\nplan_model_responses(Result, Responses) :-\n    dict_pairs(Result.vars, _, Pairs),\n    findall(Hash-Response,\n            ( member(_-Response, Pairs),\n              is_model_response(Response),\n              term_hash(Response, Hash)\n            ),\n            RawPairs),\n    sort(RawPairs, UniquePairs),\n    findall(Response, member(_-Response, UniquePairs), Responses).""",
          )
          PY
          git rm .github/usage-ledger.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prolog/rlm_plan.pl prolog/rlm_completion.pl
          git commit -m "fix(completion): account nested model usage"
          git push origin HEAD:feature/issue-20-deep-recursion-experiments
