name: Nix flake

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake:
    name: Flake package and clean runtime load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # GitHub-hosted runners support the Determinate action directly. Keep
      # the manual --init none path only for Forgejo's container runners.
      - name: Install Nix on GitHub
        if: ${{ github.server_url == 'https://github.com' }}
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Nix on Forgejo container
        if: ${{ github.server_url != 'https://github.com' }}
        run: |
          set -euo pipefail
          curl -sSfL https://install.determinate.systems/nix -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh install linux --init none --no-confirm
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix-daemon >/tmp/nix-daemon.log 2>&1 &
          for _ in $(seq 1 120); do
            [ -S /nix/var/nix/daemon-socket/socket ] && break
            sleep 0.5
          done
          if [ ! -S /nix/var/nix/daemon-socket/socket ]; then
            cat /tmp/nix-daemon.log
            exit 1
          fi
      - name: Check flake outputs
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Build default package
        run: nix build --no-update-lock-file --print-build-logs .#
      - name: Load packaged library outside checkout
        shell: bash
        run: |
          set -euo pipefail
          repo="$PWD"
          package="$(nix build --no-update-lock-file --no-link --print-out-paths .#packages.x86_64-linux.default)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          SWIPL_PACK_PATH="$package/share/swi-prolog/pack" \
            nix develop --no-update-lock-file "$repo#devShells.x86_64-linux.default" -c swipl -q -g "use_module(library(rlm)),halt"
      - name: Run packaged wrapper outside checkout
        shell: bash
        run: |
          set -euo pipefail
          package="$(nix build --no-update-lock-file --no-link --print-out-paths .#packages.x86_64-linux.default)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd "$tmp"
          "$package/bin/prolog-rlm-swipl" -q -g "use_module(library(rlm)),halt"
