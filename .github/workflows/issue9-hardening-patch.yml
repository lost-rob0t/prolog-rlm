name: Issue 9 hardening patch

on:
  push:
    branches:
      - feature/issue-9-rlm-completion
    paths:
      - .github/workflows/issue9-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/issue-9-rlm-completion
          fetch-depth: 0

      - name: Apply reviewed runtime hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch context missing: {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "prolog/rlm_completion.pl",
              "    term_hash(Response, Hash),\n    format(atom(Id), 'model_~d', [Hash]),\n",
              "    term_string(Response, StableText,\n                [quoted(true), numbervars(true)]),\n    term_hash(StableText, Hash),\n    format(atom(Id), 'model_~d', [Hash]),\n")

          replace_once(
              "prolog/rlm_completion.pl",
              "validate_child_step_capabilities(ChildCapabilities, parallel(Plans, _)) :-\n    !,\n    maplist(validate_child_plan_caps(ChildCapabilities), Plans).\nvalidate_child_step_capabilities(ChildCapabilities, retry(_, Plan, _)) :-\n    !,\n    validate_child_plan_caps(ChildCapabilities, Plan).\nvalidate_child_step_capabilities(_, _).\n\nvalidate_child_plan_caps(ChildCapabilities, Plan) :-\n    validate_plan_capabilities_only(Plan, ChildCapabilities).\n",
              "validate_child_step_capabilities(ChildCapabilities, parallel(Plans, _)) :-\n    !,\n    maplist(scan_child_capability_plan(ChildCapabilities), Plans).\nvalidate_child_step_capabilities(ChildCapabilities, retry(_, Plan, _)) :-\n    !,\n    scan_child_capability_plan(ChildCapabilities, Plan).\nvalidate_child_step_capabilities(_, _).\n\nscan_child_capability_plan(ChildCapabilities, plan(Steps)) :-\n    maplist(validate_child_step_capabilities(ChildCapabilities), Steps).\n\nvalidate_child_plan_caps(ChildCapabilities, Plan) :-\n    validate_plan_capabilities_only(Plan, ChildCapabilities).\n")

          replace_once(
              "prolog/rlm_openai_compatible.pl",
              "    catch(http_post(Endpoint, json(Payload), Reply, HttpOptions),\n          Exception,\n          true),\n",
              "    catch(http_post(Endpoint, json(Payload), Reply, HttpOptions),\n          Exception,\n          transport_exception_handler(Exception)),\n")

          replace_once(
              "prolog/rlm_openai_compatible.pl",
              "http_options(none, Timeout, Status,\n",
              "transport_exception_handler(error(rlm_cancelled(Token), Context)) :-\n    !,\n    throw(error(rlm_cancelled(Token), Context)).\ntransport_exception_handler(time_limit_exceeded) :-\n    !,\n    throw(time_limit_exceeded).\ntransport_exception_handler(time_limit_exceeded(Context)) :-\n    !,\n    throw(time_limit_exceeded(Context)).\ntransport_exception_handler(_).\n\nhttp_options(none, Timeout, Status,\n")

          replace_once(
              "prolog/rlm_plan.pl",
              "execution_exception(plan_execution(Fault), error(Error)) :-\n    !,\n    execution_fault(Fault, Error).\nexecution_exception(Exception, error(Error)) :-\n",
              "execution_exception(plan_execution(Fault), error(Error)) :-\n    !,\n    execution_fault(Fault, Error).\nexecution_exception(error(rlm_cancelled(Token), Context), _) :-\n    !,\n    throw(error(rlm_cancelled(Token), Context)).\nexecution_exception(Exception, error(Error)) :-\n")
          PY

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prolog/rlm_completion.pl prolog/rlm_openai_compatible.pl prolog/rlm_plan.pl
          git diff --cached --check
          git commit -m "Harden recursive authority and cancellation for #9"
          git push origin HEAD:feature/issue-9-rlm-completion
