name: Zara Runtime Zero-Model Cancellation Contract

on:
  pull_request:
    paths:
      - 'prolog/rlm_zara_runtime.pl'
      - 'test/rlm_zara_runtime_test.pl'
      - '.github/workflows/zara-runtime-zero-model-cancellation.yml'
  push:
    branches:
      - main
    paths:
      - 'prolog/rlm_zara_runtime.pl'
      - 'test/rlm_zara_runtime_test.pl'
      - '.github/workflows/zara-runtime-zero-model-cancellation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-model-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "expected exact source $EXPECTED_SHA, got $actual_sha" >&2
            exit 1
          }

      - name: Install SWI-Prolog and syscall audit tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox strace

      - name: Prove cancellation and failure projection stay provider-free
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/zara-runtime-zero-model-cancellation.trace"
          env \
            -u OPENAI_API_KEY \
            -u ANTHROPIC_API_KEY \
            -u OPENROUTER_API_KEY \
            -u GOOGLE_API_KEY \
            -u GEMINI_API_KEY \
            -u GROQ_API_KEY \
            -u ZAI_API_KEY \
            -u AZURE_OPENAI_API_KEY \
            -u HF_TOKEN \
            strace -f -e trace=network -o "$trace" \
            swipl -q -g "load_files('test/rlm_zara_runtime_test.pl',[silent(true)]),run_tests([rlm_zara_runtime]),halt."

          if grep -Eq 'socket\(AF_INET6?,' "$trace"; then
            echo 'unexpected IPv4/IPv6 network syscall during zero-model Zara runtime cancellation contract' >&2
            cat "$trace" >&2
            exit 1
          fi
