name: Issue12 persistent diagnostics

on:
  push:
    branches: [feature/issue-12-durable-graph]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply persistent graph diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/issue12_persist_diag_patch.py
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "nsaspy"
          git config user.email "104283403+lost-rob0t@users.noreply.github.com"
          git add test/rlm_graph_test.pl
          git commit -m "Expose persistent graph acceptance stages"
          git push origin HEAD:${GITHUB_REF_NAME}
