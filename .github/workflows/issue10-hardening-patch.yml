name: Issue 10 outcome hardening patch

on:
  push:
    branches:
      - feature/issue-10-structured-outcomes-repair
    paths:
      - .github/workflows/issue10-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/issue-10-structured-outcomes-repair
          fetch-depth: 0

      - name: Apply repair wall-time hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("prolog/rlm_outcome.pl")
          text = p.read_text()

          old = """        repair_handler_call(RepairHandler,
                            Observation,
                            NextAttempt,
                            Plan,
                            Options,
                            RepairResult),
"""
          new = """        repair_handler_call(RepairHandler,
                            Observation,
                            NextAttempt,
                            Plan,
                            Options,
                            Start,
                            OriginalBudget,
                            RepairResult),
"""
          if old not in text:
              raise SystemExit("repair call context missing")
          text = text.replace(old, new, 1)

          old = """repair_handler_call(Handler,
                    Observation,
                    Attempt,
                    Plan,
                    Options,
                    Outcome) :-
    outcome_limits(Options, Limits),
    catch(call_with_time_limit(
              Limits.repair_time_limit,
              ( call(Handler,
                     Observation,
                     Attempt,
                     Plan,
                     RepairedPlan)
              -> Outcome = ok(RepairedPlan)
              ;  Outcome = error(repair_error{kind:logical_failure,
                                               message:\"repair handler failed\"})
              )),
          Exception,
          repair_handler_exception(Exception, Outcome)).
"""
          new = """repair_handler_call(Handler,
                    Observation,
                    Attempt,
                    Plan,
                    Options,
                    Start,
                    OriginalBudget,
                    Outcome) :-
    outcome_limits(Options, Limits),
    remaining_wall_time(Start,
                        OriginalBudget.time_limit,
                        RemainingTime),
    CallbackLimit is min(Limits.repair_time_limit, RemainingTime),
    (   CallbackLimit =< 0
    ->  Outcome = error(repair_error{kind:timeout,
                                     message:\"repair loop wall-time budget exhausted\"})
    ;   catch(call_with_time_limit(
                  CallbackLimit,
                  ( call(Handler,
                         Observation,
                         Attempt,
                         Plan,
                         RepairedPlan)
                  -> Outcome = ok(RepairedPlan)
                  ;  Outcome = error(repair_error{kind:logical_failure,
                                                   message:\"repair handler failed\"})
                  )),
              Exception,
              repair_handler_exception(Exception, Outcome))
    ).
"""
          if old not in text:
              raise SystemExit("repair handler definition context missing")
          text = text.replace(old, new, 1)

          marker = """continue_after_repair(error(RepairError),
                      Current,
                      Attempt,
                      _, _, _, _, _, _, _, History0,
                      Outcome) :-
    !,
"""
          special = """continue_after_repair(error(RepairError),
                      Current,
                      Attempt,
                      _, _, _, _, _, _, _, History0,
                      Outcome) :-
    is_dict(RepairError),
    get_dict(kind, RepairError, timeout),
    !,
    Event = repair_event{attempt:Attempt,
                         status:repair_failed,
                         diagnostic:Current.status,
                         error:RepairError},
    reverse([Event|History0], History),
    put_dict(_{status:timeout,
               phase:repair,
               error:RepairError,
               repair:repair_summary{attempts:Attempt,
                                     history:History}},
             Current,
             Outcome).
continue_after_repair(error(RepairError),
                      Current,
                      Attempt,
                      _, _, _, _, _, _, _, History0,
                      Outcome) :-
    !,
"""
          if marker not in text:
              raise SystemExit("repair failure continuation context missing")
          text = text.replace(marker, special, 1)
          p.write_text(text)
          PY

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prolog/rlm_outcome.pl
          git diff --cached --check
          git commit -m "Keep repair callbacks inside original wall-time budget"
          git push origin HEAD:feature/issue-10-structured-outcomes-repair
