name: Issue 10 outcome hardening patch

on:
  push:
    branches:
      - feature/issue-10-structured-outcomes-repair
    paths:
      - .github/workflows/issue10-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/issue-10-structured-outcomes-repair
          fetch-depth: 0

      - name: Apply repair wall-time hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("prolog/rlm_outcome.pl")
          text = p.read_text()

          old = "        repair_handler_call(RepairHandler,\n                            Observation,\n                            NextAttempt,\n                            Plan,\n                            Options,\n                            RepairResult),\n"
          new = "        repair_handler_call(RepairHandler,\n                            Observation,\n                            NextAttempt,\n                            Plan,\n                            Options,\n                            Start,\n                            OriginalBudget,\n                            RepairResult),\n"
          if old not in text:
              raise SystemExit("repair call context missing")
          text = text.replace(old, new, 1)

          old = "repair_handler_call(Handler,\n                    Observation,\n                    Attempt,\n                    Plan,\n                    Options,\n                    Outcome) :-\n    outcome_limits(Options, Limits),\n    catch(call_with_time_limit(\n              Limits.repair_time_limit,\n              ( call(Handler,\n                     Observation,\n                     Attempt,\n                     Plan,\n                     RepairedPlan)\n              -> Outcome = ok(RepairedPlan)\n              ;  Outcome = error(repair_error{kind:logical_failure,\n                                               message:\"repair handler failed\"})\n              )),\n          Exception,\n          repair_handler_exception(Exception, Outcome)).\n"
          new = "repair_handler_call(Handler,\n                    Observation,\n                    Attempt,\n                    Plan,\n                    Options,\n                    Start,\n                    OriginalBudget,\n                    Outcome) :-\n    outcome_limits(Options, Limits),\n    remaining_wall_time(Start,\n                        OriginalBudget.time_limit,\n                        RemainingTime),\n    CallbackLimit is min(Limits.repair_time_limit, RemainingTime),\n    (   CallbackLimit =< 0\n    ->  Outcome = error(repair_error{kind:timeout,\n                                     message:\"repair loop wall-time budget exhausted\"})\n    ;   catch(call_with_time_limit(\n                  CallbackLimit,\n                  ( call(Handler,\n                         Observation,\n                         Attempt,\n                         Plan,\n                         RepairedPlan)\n                  -> Outcome = ok(RepairedPlan)\n                  ;  Outcome = error(repair_error{kind:logical_failure,\n                                                   message:\"repair handler failed\"})\n                  )),\n              Exception,\n              repair_handler_exception(Exception, Outcome))\n    ).\n"
          if old not in text:
              raise SystemExit("repair handler definition context missing")
          text = text.replace(old, new, 1)

          marker = "continue_after_repair(error(RepairError),\n                      Current,\n                      Attempt,\n                      _, _, _, _, _, _, _, History0,\n                      Outcome) :-\n    !,\n"
          special = "continue_after_repair(error(RepairError),\n                      Current,\n                      Attempt,\n                      _, _, _, _, _, _, _, History0,\n                      Outcome) :-\n    is_dict(RepairError),\n    get_dict(kind, RepairError, timeout),\n    !,\n    Event = repair_event{attempt:Attempt,\n                         status:repair_failed,\n                         diagnostic:Current.status,\n                         error:RepairError},\n    reverse([Event|History0], History),\n    put_dict(_{status:timeout,\n               phase:repair,\n               error:RepairError,\n               repair:repair_summary{attempts:Attempt,\n                                     history:History}},\n             Current,\n             Outcome).\ncontinue_after_repair(error(RepairError),\n                      Current,\n                      Attempt,\n                      _, _, _, _, _, _, _, History0,\n                      Outcome) :-\n    !,\n"
          if marker not in text:
              raise SystemExit("repair failure continuation context missing")
          text = text.replace(marker, special, 1)
          p.write_text(text)
          PY

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prolog/rlm_outcome.pl
          git diff --cached --check
          git commit -m "Keep repair callbacks inside original wall-time budget"
          git push origin HEAD:feature/issue-10-structured-outcomes-repair
