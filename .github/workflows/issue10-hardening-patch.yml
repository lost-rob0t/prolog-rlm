name: Issue 10 outcome hardening patch

on:
  push:
    branches:
      - feature/issue-10-structured-outcomes-repair
    paths:
      - .github/workflows/issue10-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/issue-10-structured-outcomes-repair
          fetch-depth: 0

      - name: Apply reviewed outcome fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch context missing: {path}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "prolog/rlm_outcome.pl",
              "    Head =.. [Name|Args],\n    length(Args, Arity),\n",
              "    length(Args, Arity),\n    Head =.. [Name|Args],\n")

          replace_once(
              "prolog/rlm_outcome.pl",
              "    take_prefix(Transitions,\n                Limits.trace_max_nodes,\n                Selected,\n                NodeTruncated),\n",
              "    ChildLimit is max(0, Limits.trace_max_nodes-1),\n    take_prefix(Transitions,\n                ChildLimit,\n                Selected,\n                NodeTruncated),\n")

          replace_once(
              "prolog/rlm_outcome.pl",
              "    Remaining is max(0.001, Limit-Elapsed).\n",
              "    Remaining is max(0.0, Limit-Elapsed).\n")

          replace_once(
              "prolog/rlm_outcome.pl",
              "required_capability_in_step(rlm(Plan, _), rlm).\n",
              "required_capability_in_step(rlm(_, _), rlm).\n")
          replace_once(
              "prolog/rlm_outcome.pl",
              "required_capability_in_step(parallel(Plans, _), parallel).\n",
              "required_capability_in_step(parallel(_, _), parallel).\n")
          replace_once(
              "prolog/rlm_outcome.pl",
              "required_capability_in_step(retry(_, Plan, _), retry).\n",
              "required_capability_in_step(retry(_, _, _), retry).\n")

          replace_once(
              "prolog/rlm_plan.pl",
              "        catch(call(Handler, Args, ToolResult),\n              Exception,\n              ToolResult = tool_exception(Exception)),\n",
              "        catch(call(Handler, Args, ToolResult),\n              Exception,\n              trusted_tool_exception(Exception, ToolResult)),\n")

          replace_once(
              "prolog/rlm_plan.pl",
              "handle_tool_result(tool_exception(Exception), Name, _, State,\n",
              "trusted_tool_exception(time_limit_exceeded, _) :-\n    !,\n    throw(time_limit_exceeded).\ntrusted_tool_exception(time_limit_exceeded(Context), _) :-\n    !,\n    throw(time_limit_exceeded(Context)).\ntrusted_tool_exception(error(rlm_cancelled(Token), Context), _) :-\n    !,\n    throw(error(rlm_cancelled(Token), Context)).\ntrusted_tool_exception(Exception, tool_exception(Exception)).\n\nhandle_tool_result(tool_exception(Exception), Name, _, State,\n")
          PY

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prolog/rlm_outcome.pl prolog/rlm_plan.pl
          git diff --cached --check
          git commit -m "Fix structured outcome timeout and trace semantics"
          git push origin HEAD:feature/issue-10-structured-outcomes-repair
