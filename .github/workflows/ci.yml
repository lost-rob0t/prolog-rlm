name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Deterministic unit and load checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox

      - name: Verify supported SWI-Prolog runtime
        run: swipl -q -s test/check_runtime.pl

      - name: Static load all production modules
        run: swipl -q -s test/load_all.pl

      - name: Static load live typed-plan test definition
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
        run: swipl -q -g halt -s test/live_plan_openrouter_test.pl

      - name: Run deterministic PlUnit suite
        shell: bash
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
        run: |
          set +e
          swipl -q -s test/run_tests.pl > /tmp/prolog-rlm-plunit.log 2>&1
          status=$?
          cat /tmp/prolog-rlm-plunit.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 60 /tmp/prolog-rlm-plunit.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=Deterministic PlUnit failure::${message}"
          fi
          exit "$status"

      - name: Check whitespace errors
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  live-openrouter-tests:
    name: REAL OpenRouter integration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_TEST_MODEL: ${{ vars.OPENROUTER_TEST_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox

      - name: Require live OpenRouter credential
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is not configured for live integration CI" >&2
            exit 1
          fi

      - name: Run REAL OpenRouter smoke and typed-plan tests
        shell: bash
        run: |
          set +e
          swipl -q -s test/run_live_openrouter.pl > /tmp/openrouter-live.log 2>&1
          status=$?
          cat /tmp/openrouter-live.log

          if [ "$status" -eq 0 ]; then
            evidence="$(grep -E '^(provider|requested_model|selected_model|http_status|response_received|usage_present|text_present|reasoning_present|expected_token_present|plan_provider|plan_requested_model|plan_selected_model|plan_http_status|plan_response_received|plan_parsed|plan_output_channel|plan_context_executed|plan_tool_executed|plan_final_ok|plan_transition_count):' /tmp/openrouter-live.log | tr '\n' ' ')"
            evidence="${evidence//'%'/'%25'}"
            echo "::notice title=REAL OpenRouter evidence::${evidence}"
          else
            echo "::error title=REAL OpenRouter integration failed::Real provider operation failed; inspect the redacted PlUnit output above."
          fi

          exit "$status"
