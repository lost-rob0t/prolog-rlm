name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Deterministic unit and load checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox

      - name: Verify supported SWI-Prolog runtime
        run: swipl -q -s test/check_runtime.pl

      - name: Static load all production modules
        run: swipl -q -s test/load_all.pl

      - name: Static load live integration test definitions
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
        run: |
          swipl -q -g halt -s test/live_chain_stream_openrouter_test.pl
          swipl -q -g halt -s test/live_plan_openrouter_test.pl
          swipl -q -g halt -s test/live_tool_openrouter_test.pl
          swipl -q -g halt -s test/live_completion_openrouter_test.pl
          swipl -q -g halt -s test/live_repair_openrouter_test.pl
          swipl -q -g halt -s benchmark/rlm_live_deep_experiment.pl

      - name: Verify aggregate PlUnit main ownership
        shell: bash
        run: |
          set -euo pipefail
          output="$(swipl -q -s test/runner_main_ownership_probe.pl)"
          printf '%s\n' "$output"
          grep -qx 'aggregate_main_owner=probe' <<<"$output"

      - name: Run deterministic PlUnit suite
        shell: bash
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
        run: |
          set +e
          timeout 15m swipl -q -s test/run_tests.pl > /tmp/prolog-rlm-plunit.log 2>&1
          status=$?
          set -e
          cat /tmp/prolog-rlm-plunit.log

          if [ "$status" -eq 0 ]; then
            grep -Eq '^aggregate_plunit_discovered suites=[1-9][0-9]* tests=[1-9][0-9]*$' /tmp/prolog-rlm-plunit.log || status=1
            grep -Eq '^aggregate_plunit_summary suites=[1-9][0-9]* discovered=[1-9][0-9]* executed=[1-9][0-9]* passed=[1-9][0-9]* failed=0 timeout=0 blocked=0$' /tmp/prolog-rlm-plunit.log || status=1
            grep -Eq '^aggregate_plunit_complete suites=[1-9][0-9]* tests=[1-9][0-9]*$' /tmp/prolog-rlm-plunit.log || status=1
          fi

          if [ "$status" -ne 0 ]; then
            message="$(tail -n 60 /tmp/prolog-rlm-plunit.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=Deterministic PlUnit failure::${message}"
          fi
          exit "$status"

      - name: Run deterministic benchmark and conformance suite
        shell: bash
        run: |
          set +e
          report="${RUNNER_TEMP}/prolog-rlm-benchmark.json"
          swipl -q -s benchmark/run.pl -- deterministic "$report" > /tmp/prolog-rlm-benchmark.log 2>&1
          status=$?
          cat /tmp/prolog-rlm-benchmark.log
          if [ -f "$report" ]; then
            cat "$report"
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 60 /tmp/prolog-rlm-benchmark.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=Deterministic benchmark/conformance failure::${message}"
          fi
          exit "$status"

      - name: Run deterministic deep recursion experiment
        shell: bash
        run: |
          set +e
          report="${RUNNER_TEMP}/prolog-rlm-deep-experiment.json"
          swipl -q -s benchmark/run.pl -- deep-experiment "$report" > /tmp/prolog-rlm-deep-experiment.log 2>&1
          status=$?
          cat /tmp/prolog-rlm-deep-experiment.log
          if [ -f "$report" ]; then
            cat "$report"
          fi
          if [ "$status" -eq 0 ]; then
            grep -q '"suite":"deep_recursion_experiment"' "$report" || status=1
            grep -q '"case_count":15' "$report" || status=1
            grep -q '"recursion_depth":2' "$report" || status=1
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 60 /tmp/prolog-rlm-deep-experiment.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=Deterministic deep recursion experiment failed::${message}"
          fi
          exit "$status"

      - name: Run credential-free CLI demo and trace smoke
        shell: bash
        run: |
          set -euo pipefail
          trace="${RUNNER_TEMP}/prolog-rlm-cli-graph.json"
          swipl -q -s bin/prolog-rlm.pl -- demo --json > /tmp/prolog-rlm-cli-demo.json
          grep -q '"schema":"prolog-rlm.trace.v1"' /tmp/prolog-rlm-cli-demo.json
          grep -q '"status":"pass"' /tmp/prolog-rlm-cli-demo.json
          swipl -q -s bin/prolog-rlm.pl -- demo graph --trace "$trace" --trace-format json > /tmp/prolog-rlm-cli-graph.log
          test -s "$trace"
          swipl -q -s bin/prolog-rlm.pl -- trace-view "$trace" --trace-format json > /tmp/prolog-rlm-cli-trace-view.log
          grep -q 'completed_status' /tmp/prolog-rlm-cli-trace-view.log

      - name: Verify persistent graph resume across fresh SWI processes
        shell: bash
        run: |
          set -euo pipefail
          restart_dir="$(mktemp -d)"
          trap 'rm -rf "$restart_dir"' EXIT
          checkpoint="$restart_dir/graph-checkpoint.db"
          swipl -q -s test/graph_restart_phase1.pl -- "$checkpoint"
          swipl -q -s test/graph_restart_phase2.pl -- "$checkpoint"

      - name: Verify durable artifact handoff across fresh SWI processes
        shell: bash
        run: |
          set -euo pipefail
          restart_dir="$(mktemp -d)"
          trap 'rm -rf "$restart_dir"' EXIT
          checkpoint="$restart_dir/artifact-graph-checkpoint.db"
          artifacts="$restart_dir/artifacts.db"
          swipl -q -s test/artifact_restart_phase1.pl -- "$checkpoint" "$artifacts"
          swipl -q -s test/artifact_restart_phase2.pl -- "$checkpoint" "$artifacts"

      - name: Check whitespace errors
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  live-openrouter:
    name: REAL OpenRouter integration
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_TEST_MODEL: ${{ vars.OPENROUTER_TEST_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox

      - name: Require live OpenRouter credential
        shell: bash
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is not configured for live integration CI" >&2
            exit 1
          fi

      - name: Run REAL OpenRouter core suite
        shell: bash
        run: |
          set +e
          swipl -q -s test/run_live_openrouter.pl > /tmp/openrouter-core.log 2>&1
          status=$?
          cat /tmp/openrouter-core.log

          if [ "$status" -eq 0 ]; then
            evidence="$(grep -E '^(provider|requested_model|selected_model|http_status|response_received|usage_present|text_present|reasoning_present|expected_token_present|stream_provider|stream_requested_model|stream_selected_model|stream_http_status|stream_response_received|stream_incremental_event_count|stream_done|stream_usage_present|stream_final_text_present|plan_provider|plan_requested_model|plan_selected_model|plan_http_status|plan_response_received|plan_parsed|plan_output_channel|plan_context_executed|plan_tool_executed|plan_final_ok|plan_transition_count|real_tool_provider|real_tool_requested_model|real_tool_selected_model|real_tool_http_status|real_tool_response_received|real_tool_plan_parsed|real_tool_plan_output_channel|real_tool_invoked|real_tool_authorization|real_tool_status|real_tool_file_token_seen|real_tool_transition_count|completion_provider|completion_root_http_status|completion_plan_parsed|completion_context_executed|completion_tool_executed|completion_tool_authorization|completion_tool_status|completion_recursive_model_http_status|completion_recursive_depth|completion_recursive_calls|completion_total_model_calls|completion_file_token_seen|completion_final_ok):' /tmp/openrouter-core.log | tr '\n' ' ')"
            evidence="${evidence//'%'/'%25'}"
            echo "::notice title=REAL OpenRouter core evidence::${evidence}"
          else
            message="$(tail -n 40 /tmp/openrouter-core.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=REAL OpenRouter core integration failed::${message}"
          fi

          exit "$status"

      - name: Run REAL OpenRouter structured repair suite
        shell: bash
        run: |
          set +e
          swipl -q -s test/run_live_repair_openrouter.pl > /tmp/openrouter-repair.log 2>&1
          status=$?
          cat /tmp/openrouter-repair.log

          if [ "$status" -eq 0 ]; then
            evidence="$(grep -E '^(repair_provider|repair_requested_model|repair_selected_model|repair_http_status|repair_provider_consulted|repair_model_response_present|repair_observation_status|repair_policy_selected|repair_plan_materialized|repair_plan_output_channel|repair_provider_attempt_used|repair_attempts|repair_original_budget_preserved|repair_final_ok):' /tmp/openrouter-repair.log | tr '\n' ' ')"
            evidence="${evidence//'%'/'%25'}"
            echo "::notice title=REAL OpenRouter repair evidence::${evidence}"
          else
            message="$(tail -n 40 /tmp/openrouter-repair.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=REAL OpenRouter structured repair failed::${message}"
          fi

          exit "$status"

      - name: Run REAL OpenRouter benchmark suite
        shell: bash
        run: |
          set +e
          report="${RUNNER_TEMP}/prolog-rlm-openrouter-benchmark.json"
          swipl -q -s benchmark/run.pl -- integration "$report" > /tmp/openrouter-benchmark.log 2>&1
          status=$?
          cat /tmp/openrouter-benchmark.log
          if [ -f "$report" ]; then
            cat "$report"
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 60 /tmp/openrouter-benchmark.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=REAL OpenRouter benchmark failed::${message}"
          fi
          exit "$status"

      - name: Run REAL depth 0/1/2 recursion experiment
        shell: bash
        run: |
          set +e
          report="${RUNNER_TEMP}/prolog-rlm-openrouter-deep.json"
          status=1
          for attempt in 1 2; do
            swipl -q -s benchmark/run.pl -- deep-integration "$report" > /tmp/openrouter-deep.log 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            cat /tmp/openrouter-deep.log
            sleep 6
          done
          cat /tmp/openrouter-deep.log
          if [ -f "$report" ]; then
            cat "$report"
          fi
          if [ "$status" -eq 0 ]; then
            grep -q '"suite":"deep_openrouter_experiment"' "$report" || status=1
            grep -q '"case_count":3' "$report" || status=1
            grep -q '"recursion_depth":2' "$report" || status=1
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 /tmp/openrouter-deep.log | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=REAL depth recursion experiment failed::${message}"
          fi
          exit "$status"

      - name: Run one-command REAL RLM CLI smoke
        shell: bash
        run: |
          set +e
          status=1
          for attempt in 1 2; do
            swipl -q -s bin/prolog-rlm.pl -- rlm \
              "Return the token CLI_RLM_OK using the external context." \
              --context "The required token is CLI_RLM_OK." \
              --max-tokens 96 \
              --time-limit 60 \
              --json > /tmp/prolog-rlm-live-cli.json 2> /tmp/prolog-rlm-live-cli.err
            status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            cat /tmp/prolog-rlm-live-cli.err
            sleep 6
          done
          cat /tmp/prolog-rlm-live-cli.err
          if [ -f /tmp/prolog-rlm-live-cli.json ]; then
            cat /tmp/prolog-rlm-live-cli.json
          fi
          if [ "$status" -eq 0 ]; then
            grep -q '"schema":"prolog-rlm.trace.v1"' /tmp/prolog-rlm-live-cli.json || status=1
            grep -q '"max_depth":1' /tmp/prolog-rlm-live-cli.json || status=1
            grep -q '"model_calls":' /tmp/prolog-rlm-live-cli.json || status=1
          fi
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 60 /tmp/prolog-rlm-live-cli.err | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            echo "::error title=REAL RLM CLI smoke failed::${message}"
          fi
          exit "$status"
