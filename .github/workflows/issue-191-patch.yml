name: Issue 191 tool visibility patch

on:
  push:
    branches:
      - fix/191-capability-filtered-tool-schemas

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SWI-Prolog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog-nox

      - name: Apply capability-filtered planner schema patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("prolog/rlm_completion.pl"); s=p.read_text(); old="        tool_discover(Registry, Schemas)\n    ),\n    append(RegistryTools, DirectTools, Tools).\n\ntool_invocation_options(Options, InvocationOptions) :-"; new="        tool_discover(Registry, DiscoveredSchemas),\n        include(tool_schema_capability_allowed(Capabilities),\n                DiscoveredSchemas,\n                Schemas)\n    ),\n    append(RegistryTools, DirectTools, Tools).\n\ntool_schema_capability_allowed(Capabilities, Schema) :-\n    is_dict(Schema),\n    get_dict(capability, Schema, Capability),\n    capability_allowed(Capabilities, Capability).\n\ntool_invocation_options(Options, InvocationOptions) :-"; assert old in s; p.write_text(s.replace(old, new, 1))'

      - name: Run focused regression and completion tests
        shell: bash
        run: |
          set -euo pipefail
          swipl -q -s test/rlm_completion_tool_visibility_test.pl -g 'run_tests,halt'
          swipl -q -s test/rlm_completion_test.pl -g 'run_tests,halt'
          swipl -q -s test/check_runtime.pl
          git diff --check

      - name: Commit verified runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prolog/rlm_completion.pl
          if git diff --cached --quiet; then
            echo 'No runtime patch to commit.'
            exit 0
          fi
          git commit -m 'fix: filter planner tool schemas by capabilities'
          git push origin HEAD:fix/191-capability-filtered-tool-schemas
