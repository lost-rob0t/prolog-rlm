name: Report workflow failures

on:
  workflow_run:
    workflows:
      - CI
      - Nix flake
      - Tree-sitter FFI
      - Clean SWI pack install
      - Paid OpenRouter
      - AgentProlog UI
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Report trusted workflow failure
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT: ${{ github.event.workflow_run.event }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Create or update failure issue
        shell: bash
        run: |
          set -euo pipefail

          title="[CI failure] ${WORKFLOW} on ${BRANCH}"
          body="${RUNNER_TEMP}/workflow-failure.md"

          {
            echo "Automated prolog-rlm workflow failure report."
            echo
            echo "- Workflow: \`${WORKFLOW}\`"
            echo "- Run: ${RUN_URL}"
            echo "- Branch: \`${BRANCH}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Event: \`${EVENT}\`"
            echo "- Attempt: \`${ATTEMPT}\`"
            echo "- Conclusion: \`${CONCLUSION}\`"
            if [[ -n "${PR_NUMBER:-}" ]]; then
              echo "- Pull request: #${PR_NUMBER}"
            fi
            echo
            echo "This issue is deduplicated by workflow + branch. Close it after the failure is resolved; a later regression will open a new issue."
            echo
            echo "_Generated by \`.github/workflows/report-workflow-failures.yml\`._"
          } > "$body"

          existing="$({
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title
          } | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n1)"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file "$body"
          fi
