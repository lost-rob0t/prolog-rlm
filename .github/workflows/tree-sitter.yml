name: Tree-sitter FFI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-swi-ffi:
    name: Direct SWI-Prolog Tree-sitter FFI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SWI-Prolog and Tree-sitter development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            swi-prolog-nox \
            build-essential \
            pkg-config \
            libtree-sitter-dev \
            tree-sitter-c-src \
            tree-sitter-lua-src \
            tree-sitter-query-src

      - name: Build direct foreign library
        run: make tree-sitter-ffi

      - name: Build packaged grammar fixtures
        run: make tree-sitter-test-grammars

      - name: Run direct FFI tests
        run: swipl -q -s test/run_tree_sitter_tests.pl

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
