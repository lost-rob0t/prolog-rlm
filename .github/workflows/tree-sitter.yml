name: Tree-sitter FFI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-swi-ffi:
    name: Direct SWI-Prolog Tree-sitter FFI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Forgejo runner jobs execute in Docker containers without systemd.
      # Install Nix with --init none and spawn the daemon directly instead of
      # relying on the installer's systemd integration or action detection.
      - name: Install Nix and start daemon
        run: |
          set -euo pipefail
          curl -sSfL https://install.determinate.systems/nix -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh install linux --init none --no-confirm
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix-daemon >/tmp/nix-daemon.log 2>&1 &
          for _ in $(seq 1 120); do
            [ -S /nix/var/nix/daemon-socket/socket ] && break
            sleep 0.5
          done
          if [ ! -S /nix/var/nix/daemon-socket/socket ]; then
            cat /tmp/nix-daemon.log
            exit 1
          fi
          nix --version

      - name: Build direct foreign library
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix develop --no-update-lock-file --command make tree-sitter-ffi

      - name: Link packaged grammar fixtures
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          mkdir -p test/fixtures/tree-sitter
          nix develop --no-update-lock-file --command bash -c '
            extension="$(swipl -q -g "current_prolog_flag(shared_object_extension,E),write(E),halt.")"
            for language in c lua query python javascript markdown json org common_lisp nim; do
              ln -sfn "$RLM_TREE_SITTER_GRAMMAR_DIR/$language" "test/fixtures/tree-sitter/$language.$extension"
            done
            ln -sfn "$RLM_TREE_SITTER_INCOMPATIBLE_ABI_FIXTURE/rlm-incompatible-abi.so" "test/fixtures/tree-sitter/c-incompatible.$extension"
          '

      - name: Run direct FFI tests
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix develop --no-update-lock-file --command swipl -q -s test/run_tree_sitter_tests.pl

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
