name: Fix 298 self patch

on:
  push:
    branches:
      - fix/298-native-any-json-schema

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch unconstrained native JSON Schema rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('prolog/rlm_native_tool.pl')
          source = path.read_text()
          old = '''json_schema(Input, Output) :-
              require_dict(Input, json_schema),
              require_key(Input, type, Type0, json_schema),
              schema_type(Type0, Type),
              json_schema_pairs(Input, Pairs),
              dict_pairs(Fields, json, Pairs),
              put_dict(type, Fields, Type, Output).
          '''
          new = '''json_schema(Input, Output) :-
              require_dict(Input, json_schema),
              require_key(Input, type, Type0, json_schema),
              json_schema_type(Type0, Input, Output).

          json_schema_type(any, Input, Output) :-
              !,
              json_schema_pairs(Input, Pairs),
              dict_pairs(Output, json, Pairs).
          json_schema_type(Type0, Input, Output) :-
              schema_type(Type0, Type),
              json_schema_pairs(Input, Pairs),
              dict_pairs(Fields, json, Pairs),
              put_dict(type, Fields, Type, Output).
          '''
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif 'json_schema_type(any, Input, Output)' not in source:
              raise SystemExit('expected rlm_native_tool json_schema block not found')
          PY

      - name: Install SWI-Prolog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog-nox

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          swipl -q -s test/rlm_native_tool_test.pl -g 'run_tests,halt'
          swipl -q -s test/rlm_native_any_schema_test.pl -g 'run_tests,halt'
          swipl -q -s test/load_all.pl

      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- prolog/rlm_native_tool.pl; then
            exit 0
          fi
          git config user.name 'fix-298[bot]'
          git config user.email 'fix-298@users.noreply.github.com'
          git add prolog/rlm_native_tool.pl
          git commit -m 'fix: render runtime any as unconstrained JSON Schema'
          git push origin HEAD:fix/298-native-any-json-schema
