name: AgentProlog UI

on:
  push:
    paths:
      - "agentProlog/ui/opentui/**"
      - "agentProlog/fixtures/prolog_agent_ui_v1_session.ndjson"
      - "agentProlog/prolog/prolog_agent_ui_v1.pl"
      - "agentProlog/prolog/prolog_agent_ui_fixture.pl"
      - ".github/workflows/agent-prolog-ui.yml"
  pull_request:
    paths:
      - "agentProlog/ui/opentui/**"
      - "agentProlog/fixtures/prolog_agent_ui_v1_session.ndjson"
      - "agentProlog/prolog/prolog_agent_ui_v1.pl"
      - "agentProlog/prolog/prolog_agent_ui_fixture.pl"
      - ".github/workflows/agent-prolog-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-client:
    name: OpenTUI reference client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentProlog/ui/opentui
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
        working-directory: .

      - name: Install pinned frontend dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run protocol, transport, and render tests
        run: bun run test:ci
