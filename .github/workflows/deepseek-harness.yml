name: DeepSeek Harness Prolog bridge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-bridge:
    name: Headless AgentProlog and real SWI bridge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned Harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Use DeepSeek Harness Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox

      - name: Verify launcher shell
        run: |
          test -x bin/agentProlog
          bash -n bin/agentProlog

      - name: Verify exact pinned Harness source packages
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          for (const path of [
            'agentProlog/deepseek-harness/upstream/apps/cli/package.json',
            'agentProlog/deepseek-harness/upstream/packages/core/agent/package.json',
            'agentProlog/deepseek-harness/upstream/packages/core/scope/package.json',
            'agentProlog/deepseek-harness/upstream/packages/core/session/package.json',
            'agentProlog/deepseek-harness/upstream/packages/bundle/headless/package.json',
          ]) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
            if (pkg.version !== '0.1.0-rc.8') {
              throw new Error(`${path}: expected 0.1.0-rc.8, got ${pkg.version}`)
            }
          }
          NODE

      - name: Test host transport and Prolog-backed headless factory
        run: node --test agentProlog/deepseek-harness/host/*.test.mjs

      - name: Test real host to Prolog composition explicitly
        run: node --test agentProlog/deepseek-harness/host/bridge-client.integration.test.mjs

      - name: Run deterministic Prolog suite
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
        run: swipl -q -s test/run_tests.pl

      - name: Compose the real headless AgentProlog profile
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
          AGENTPROLOG_DSH_HOME: ${{ runner.temp }}/agentprolog-dsh
        run: |
          bin/agentProlog --dump-config > /tmp/agentprolog-config.yml
          grep -q "@prolog-rlm/dsh-agent-factory'" /tmp/agentprolog-config.yml
          grep -q "@prolog-rlm/dsh-agent-factory/headless'" /tmp/agentprolog-config.yml
          grep -q 'id: headless-runner' /tmp/agentprolog-config.yml
          grep -q 'disabled: true' /tmp/agentprolog-config.yml

      - name: Verify headless CLI help boots without a provider call
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
          AGENTPROLOG_DSH_HOME: ${{ runner.temp }}/agentprolog-dsh
        run: bin/agentProlog --help

      - name: Verify pinned DeepSeek Harness gitlink
        shell: bash
        run: |
          set -euo pipefail
          expected='141eb6fef83422698aef7a981029e843e8161534'
          actual="$(git ls-tree HEAD agentProlog/deepseek-harness/upstream | awk '{print $3}')"
          test "$actual" = "$expected"
          test "$(git -C agentProlog/deepseek-harness/upstream rev-parse HEAD)" = "$expected"

      - name: Check whitespace errors
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
