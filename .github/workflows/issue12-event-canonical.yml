name: Issue12 persistent event canonicalization

on:
  push:
    branches: [feature/issue-12-durable-graph]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply persistent event canonicalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/issue12_event_canonical_patch.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "nsaspy"
          git config user.email "104283403+lost-rob0t@users.noreply.github.com"
          git add prolog/rlm_graph.pl
          git commit -m "Canonicalize persistent graph event payloads"
          git push origin HEAD:${GITHUB_REF_NAME}
