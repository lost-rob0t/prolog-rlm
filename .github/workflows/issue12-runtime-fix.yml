name: Issue12 runtime conformance fixes

on:
  push:
    branches: [feature/issue-12-durable-graph]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply graph runtime conformance fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/issue12_runtime_fix.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "nsaspy"
          git config user.email "104283403+lost-rob0t@users.noreply.github.com"
          git add prolog/rlm_graph.pl test/rlm_graph_test.pl
          git commit -m "Fix graph resume and nested cancellation semantics"
          git push origin HEAD:${GITHUB_REF_NAME}
