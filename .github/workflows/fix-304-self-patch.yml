name: Fix 304 self patch

on:
  push:
    branches:
      - fix/304-context-peek-selector-contract

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch context peek runtime validation to match exported schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('prolog/rlm_direct.pl')
          source = path.read_text()
          old = '''peek_selector_type(metadata, Dict, metadata) :- allowed_args(Dict, [type]).
          peek_selector_type(head, Dict, head(N)) :-
              allowed_args(Dict,[type,count]), required_positive(Dict,count,N).
          peek_selector_type(tail, Dict, tail(N)) :-
              allowed_args(Dict,[type,count]), required_positive(Dict,count,N).
          peek_selector_type(item, Dict, item(N)) :-
              allowed_args(Dict,[type,index]), required_nonnegative(Dict,index,N).
          '''
          new = '''peek_selector_type(metadata, Dict, metadata) :-
              allowed_args(Dict, [type,index,count]).
          peek_selector_type(head, Dict, head(N)) :-
              allowed_args(Dict,[type,index,count]), required_positive(Dict,count,N).
          peek_selector_type(tail, Dict, tail(N)) :-
              allowed_args(Dict,[type,index,count]), required_positive(Dict,count,N).
          peek_selector_type(item, Dict, item(N)) :-
              allowed_args(Dict,[type,index,count]), required_nonnegative(Dict,index,N).
          '''
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif 'allowed_args(Dict, [type,index,count])' not in source:
              raise SystemExit('expected context peek selector block not found')
          PY

      - name: Install SWI-Prolog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog-nox

      - name: Run direct runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          swipl -q -s test/rlm_direct_context_peek_contract_test.pl -g 'run_tests,halt'
          swipl -q -s test/rlm_direct_test.pl -g 'run_tests,halt'
          swipl -q -s test/load_all.pl

      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- prolog/rlm_direct.pl; then
            exit 0
          fi
          git config user.name 'fix-304[bot]'
          git config user.email 'fix-304@users.noreply.github.com'
          git add prolog/rlm_direct.pl
          git commit -m 'fix: align context peek validation with native schema'
          git push origin HEAD:fix/304-context-peek-selector-contract
