name: Runner integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runner-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox

      - name: Prove consulted focused runner cannot replace main
        shell: bash
        run: |
          set -euo pipefail
          output="$(swipl -q -s test/runner_main_ownership_probe.pl)"
          printf '%s\n' "$output"
          grep -qx 'aggregate_main_owner=probe' <<<"$output"

      - name: Prove aggregate suite actually starts PlUnit
        shell: bash
        env:
          OPENROUTER_API_KEY: ""
          OPENROUTER_TEST_MODEL: ""
        run: |
          set +e
          timeout 10m swipl -q -s test/run_tests.pl > /tmp/prolog-rlm-runner-integrity.log 2>&1
          status=$?
          set -e
          cat /tmp/prolog-rlm-runner-integrity.log

          if [ "$status" -eq 124 ]; then
            echo "aggregate PlUnit runner timed out" >&2
            exit 1
          fi

          grep -Eq 'PL-Unit:|ERROR: .*test/|\.\.+|All [0-9]+ tests passed' /tmp/prolog-rlm-runner-integrity.log || {
            echo "aggregate runner produced no PlUnit evidence" >&2
            exit 1
          }

          exit "$status"
