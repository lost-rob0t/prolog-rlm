name: Apply canonical agent graph async slice

on:
  push:
    branches:
      - feature/issue-54-agent-graph-canonical-async

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/issue-54-agent-graph-canonical-async
          fetch-depth: 0

      - name: Apply deterministic source transformation
        run: python3 .github/apply-agent-graph.py

      - name: Remove staging helpers and verify diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/agent-graph-canonical.patch
          git rm .github/apply-agent-graph.py
          git rm .github/workflows/apply-agent-graph-slice.yml
          git add prolog test docs
          git diff --cached --check
          grep -q 'agent_send_execute' prolog/rlm_agent.pl
          grep -q 'graph_run_execute' prolog/rlm_graph.pl
          grep -q 'subgraph_execute_abi_avoids_nested_future_deadlock_under_saturation' test/rlm_agent_graph_async_test.pl

      - name: Commit and push implementation
        shell: bash
        env:
          BRANCH: feature/issue-54-agent-graph-canonical-async
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: canonicalize agent and graph async execution'
          git push origin "HEAD:${BRANCH}"
