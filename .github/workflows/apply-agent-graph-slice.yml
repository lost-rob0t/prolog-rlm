name: Apply canonical agent graph async slice

on:
  push:
    branches:
      - feature/issue-54-agent-graph-canonical-async

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/issue-54-agent-graph-canonical-async
          fetch-depth: 0

      - name: Materialize test and filter patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          patch_path = Path('.github/agent-graph-canonical.patch')
          text = patch_path.read_text()
          test_marker = 'diff --git a/test/rlm_agent_graph_async_test.pl b/test/rlm_agent_graph_async_test.pl\n'
          docs_marker = 'diff --git a/docs/agent-runtime.md b/docs/agent-runtime.md\n'
          start = text.index(test_marker)
          end = text.index(docs_marker, start)
          test_section = text[start:end]
          hunk = test_section.index('@@')
          hunk_end = test_section.index('\n', hunk)
          output = []
          for line in test_section[hunk_end + 1:].splitlines():
              if line.startswith('+') and not line.startswith('+++'):
                  output.append(line[1:])
          Path('test/rlm_agent_graph_async_test.pl').write_text('\n'.join(output) + '\n')
          skipped = {
              'a/test/rlm_agent_graph_async_test.pl b/test/rlm_agent_graph_async_test.pl',
              'a/docs/graph-runtime.md b/docs/graph-runtime.md',
          }
          kept = []
          for section in text.split('diff --git ')[1:]:
              header = section.splitlines()[0]
              if header in skipped:
                  continue
              kept.append('diff --git ' + section)
          Path('/tmp/agent-graph-source.patch').write_text(''.join(kept))
          PY

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/agent-graph-source.patch
          git apply /tmp/agent-graph-source.patch

      - name: Remove staging helpers and verify diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/agent-graph-canonical.patch
          git rm .github/workflows/apply-agent-graph-slice.yml
          git add prolog test docs/agent-runtime.md
          git diff --cached --check
          grep -q 'agent_send_execute' prolog/rlm_agent.pl
          grep -q 'graph_run_execute' prolog/rlm_graph.pl
          grep -q 'subgraph_execute_abi_avoids_nested_future_deadlock_under_saturation' test/rlm_agent_graph_async_test.pl

      - name: Commit and push implementation
        shell: bash
        env:
          BRANCH: feature/issue-54-agent-graph-canonical-async
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: canonicalize agent and graph async execution'
          git push origin "HEAD:${BRANCH}"
